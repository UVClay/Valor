# Recompilation config for Medal of Honor (USA), SLUS-00974.
# Paths are relative to the repo root.

project = "game"
extracted = "extracted/moh"
overlay_base = 0x80039D90
# A longjmp can resume code right after a call to these (PsyQ's interrupt dispatcher does).
continuations = ["setjmp"]

[exe]
name = "exe"
file = "SLUS_009.74"
# The exe's tail past overlay_base is overwritten by whichever overlay is loaded.
code_end = 0x80039D90
symbols = ["build/syms/SLUS_009.74.psyq.txt"]
seeds = []

# Overlays all load at overlay_base. `id` is the first word of each file; the runtime
# reads it to know which overlay is currently resident.
[[overlay]]
name = "shell"
id = 7
file = "SHELL.BIN"
entry = 0x8005FC28
symbols = ["build/syms/SHELL.BIN.psyq.txt"]
seeds = []

[[overlay]]
name = "level"
id = 5
file = "LEVEL.BIN"
entry = 0x80064374
symbols = []
seeds = []

[[overlay]]
name = "level2p"
id = 6
file = "LEVEL2P.BIN"
entry = 0x8005F280
symbols = []
seeds = []

# Game functions wrapped by native runtime code (runtime/src/game.cpp), per module:
# address -> hook(Cpu *c, RecompFn body), which runs the original body itself.
[hooks.level]
# Control role axis (port, role, ?) -> value: adds mouse and keyboard input.
"0x80075FB4" = "hook_role_axis"
# Control role from another role's stick (pitch from the move stick): traced for the engine.
"0x80076008" = "hook_role_axis_alt"
# The idle work while waiting for the vblank (traced: which jobs ran after each frame).
"0x80090A30" = "hook_frame_idle_job"
"0x80090AEC" = "hook_idle_round"
"0x80090B80" = "hook_frame_wait"
"0x8003EF5C" = "hook_world_sweep"
# Builds the view frustum's planes from the camera (culls rooms and objects): widened to the
# widescreen/FOV projection.
"0x8008D0CC" = "hook_view_frustum"
# Decoupled rendering (runtime/src/shadow.cpp): the drawing pass, and its flip.
"0x800503D4" = "hook_render_pass"
"0x800504F8" = "hook_render_flip"
"0x80053B8C" = "hook_prim_pool"
"0x8004913C" = "hook_camera_setup"
# The HUD routine: its packets are the HUD (widescreen HUD).
"0x8008019C" = "hook_draw_hud"
# Reverse engineering traces (runtime/src/watch.cpp): damage applied to an entity.
"0x8004AC58" = "hook_apply_damage"
# bullet_spawn: VALOR_TRACE_SHOTS logs the player's shots against the view (runtime/src/watch.cpp).
"0x80045A78" = "hook_bullet_spawn"
# texts_update, once per tick after collisions: VALOR_TRACE_STATE writes the state (watch.cpp).
"0x8005F69C" = "hook_texts_update"
# VALOR_TRACE_INPUT (watch.cpp): the control roles' values and the pad each tick.
"0x80075A30" = "hook_role_button"
"0x8007A6B0" = "hook_player_update"

[hooks.exe]
# What the SPU reports for each voice (traced: when the hardware finished a sample).
"0x80015A9C" = "hook_spu_keys"
# World polygon visibility: polygons reaching behind the camera are near-clipped instead.
"0x80011214" = "hook_world_polygon"
# ClearOTagR, done natively in a decoupled rendering pass.
"0x8001722C" = "hook_clear_otag_r"
# rand: VALOR_TRACE_RAND logs every draw with its caller (runtime/src/watch.cpp).
"0x8001552C" = "hook_rand"
